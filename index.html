<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121214">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>운동 기록</title>
<style>
  :root {
    --bg: #121214;
    --card: #1b1c20;
    --card2: #24262b;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #f97316;
    --accent-soft: rgba(249,115,22,0.14);
    --accent2: #f97316;
    --done: #22c55e;
    --danger: #ef4444;
    --border: #2e3037;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0 0 92px 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(18, 18, 20, 0.95); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 14px 10px;
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .title { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
  .top-right { display: flex; align-items: center; gap: 6px; }
  .date-badge { font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
  .mode-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .mode-btn.active { background: var(--accent); color: #121214; border-color: var(--accent); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tab {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    padding: 9px 4px; border-radius: 10px; font-size: 13px; font-weight: 700;
    text-align: center; cursor: pointer;
  }
  .tab.active { background: var(--accent); color: #121214; border-color: var(--accent); }
  .container { padding: 12px 14px; max-width: 560px; margin: 0 auto; }
  .day-banner {
    background: linear-gradient(135deg, #1e1f24, #17181c); border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .day-banner .sub { font-size: 12px; color: var(--accent); font-weight: 700; margin-top: 2px; }
  .ex-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 13px; margin-bottom: 12px;
  }
  .ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 7px; }
  .ex-name { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; }
  .ex-goal { font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; white-space: nowrap; font-weight: 700; }
  .prev-box {
    font-size: 12px; color: #d4d4d8; background: var(--card2);
    border-left: 3px solid var(--accent); border-radius: 6px;
    padding: 6px 9px; margin-bottom: 10px;
  }
  .prev-box.empty { border-left-color: var(--border); color: var(--muted); }
  .sets-grid { display: flex; flex-direction: column; gap: 7px; }
  .set-row {
    background: #141417; border: 1px solid var(--border); border-radius: 11px;
    padding: 9px 12px; display: flex; align-items: center; gap: 10px;
    transition: border-color .15s, background .15s;
  }
  .set-row.done { border-color: var(--accent); background: rgba(249,115,22,0.11); }
  .set-lbl {
    font-size: 11px; color: var(--muted); width: 42px; font-weight: 800;
    letter-spacing: 0.4px; text-transform: uppercase; flex-shrink: 0;
  }
  .set-lbl::before { content: "SET "; font-size: 9px; color: #71717a; display: block; line-height: 1; margin-bottom: 1px; }
  .set-inp {
    width: 100%; background: transparent; border: none; color: var(--text);
    font-size: 17px; font-weight: 800; outline: none; min-width: 0; font-variant-numeric: tabular-nums;
  }
  .set-inp::placeholder { color: #3f3f46; font-weight: 500; font-size: 14px; }
  .check-btn {
    width: 34px; height: 34px; border-radius: 999px; border: 2px solid #3f3f46;
    background: transparent; color: var(--muted); font-size: 15px; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .set-row.done .check-btn { background: var(--accent); color: #121214; border-color: var(--accent); font-weight: 900; }
  .meta-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .rir-select, .memo-inp {
    background: #121214; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 9px; font-size: 13px; outline: none;
  }
  .rir-select { width: 92px; flex-shrink: 0; font-weight: 600; }
  .memo-inp { width: 100%; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .btn {
    border: none; border-radius: 12px; padding: 13px 12px; font-size: 14px; font-weight: 800;
    cursor: pointer; text-align: center;
  }
  .btn-save { background: var(--accent); color: #121214; }
  .btn-copy { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
  .f-chip {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
  }
  .f-chip.active { background: var(--accent); color: #121214; border-color: var(--accent); }
  .hist-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; margin-bottom: 10px;
  }
  .hist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .hist-title { font-size: 15px; font-weight: 800; color: var(--accent); }
  .del-btn {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    padding: 3px 8px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .hist-line { font-size: 13px; padding: 4px 0; border-top: 1px solid rgba(46,48,55,0.8); }
  .hist-line:first-of-type { border-top: none; }
  .timer-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: rgba(18, 18, 20, 0.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .timer-display { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); min-width: 72px; }
  .timer-display.done { color: var(--done); }
  .timer-btns { display: flex; gap: 6px; }
  .t-btn {
    border: 1px solid var(--border); background: var(--card2); color: var(--text);
    padding: 8px 13px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .t-btn.primary { background: var(--accent); color: #121214; border-color: var(--accent); }
  .fb-banner {
    background: linear-gradient(180deg, rgba(249,115,22,0.12), rgba(249,115,22,0.03));
    border: 1px solid rgba(249,115,22,0.35); border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
  }
  .fb-label { font-size: 11px; letter-spacing: .4px; color: var(--accent); font-weight: 800; margin-bottom: 4px; }
  .fb-text { font-size: 13.5px; color: #e4e4e7; white-space: pre-wrap; }
  .sync-note { font-size: 11px; color: var(--muted); text-align: right; margin: -4px 2px 10px; }
  .sync-note.off { color: #fbbf24; }
  .toast {
    position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #121214; padding: 8px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 800; z-index: 50; display: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
<header>
  <div class="top-row">
    <div class="title">🏋️ 운동 기록</div>
    <div class="top-right">
      <span class="date-badge" id="todayLabel"></span>
      <button class="mode-btn" id="modeBtn" onclick="toggleView()">히스토리</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="container" id="recordView">
  <div class="fb-banner" id="fbBanner" style="display:none;">
    <div class="fb-label" id="fbLabel">코치 메모</div>
    <div class="fb-text" id="fbText"></div>
  </div>
  <div class="day-banner">
    <div>
      <div style="font-weight:700;font-size:15px;" id="dayTitle"></div>
      <div class="sub" id="daySub"></div>
    </div>
    <div style="font-size:12px;color:var(--muted);text-align:right;" id="doneCount"></div>
  </div>
  <div class="sync-note" id="syncNote"></div>
  <div id="exList"></div>
  <div class="actions">
    <button class="btn btn-save" onclick="finishSession()">오늘 기록 저장</button>
    <button class="btn btn-copy" onclick="copyReport()">요니에게 보낼 텍스트 복사</button>
  </div>
</div>

<div class="container" id="historyView" style="display:none;">
  <div class="filter-row" id="histFilters"></div>
  <div id="histList"></div>
</div>

<div class="timer-bar">
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:12px;color:var(--muted);font-weight:600;">휴식</span>
    <span class="timer-display" id="timerDisplay">01:30</span>
  </div>
  <div class="timer-btns">
    <button class="t-btn primary" onclick="startTimer(90)">90초</button>
    <button class="t-btn" onclick="startTimer(60)">60초</button>
    <button class="t-btn" onclick="stopTimer()">정지</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_PROGRAM = {
  day1: {
    label: "Day 1 밀기",
    sub: "가슴 · 어깨 · 삼두 (휴식 90초)",
    exercises: [
      { id: "d1_1", name: "체스트프레스 머신", goal: "4 x 8~10", sets: 4, rest: 90, rir: "2" },
      { id: "d1_2", name: "숄더프레스 머신", goal: "3 x 8~10", sets: 3, rest: 90, rir: "2" },
      { id: "d1_3", name: "케이블 푸시다운", goal: "3 x 10~12", sets: 3, rest: 90, rir: "1" },
      { id: "d1_4", name: "사이드 레터럴 레이즈", goal: "3 x 12~15", sets: 3, rest: 90, rir: "1" }
    ]
  },
  day2: {
    label: "Day 2 하체",
    sub: "뒷다리 우선 + 스쿼트 계열 (휴식 90초)",
    exercises: [
      { id: "d2_1", name: "레그 컬 (선피로 · 웜업 2세트)", goal: "4 x 10~12", sets: 4, rest: 90, rir: "1" },
      { id: "d2_2", name: "스미스 스쿼트 (웜업 2세트)", goal: "3 x 8~10", sets: 3, rest: 90, rir: "2" },
      { id: "d2_3", name: "레그프레스 (발판 상단)", goal: "3 x 10~12", sets: 3, rest: 90, rir: "2" },
      { id: "d2_4", name: "루마니안 데드리프트 (덤벨)", goal: "3 x 10", sets: 3, rest: 90, rir: "2" },
      { id: "d2_5", name: "카프 레이즈", goal: "4 x 15", sets: 4, rest: 90, rir: "1" }
    ]
  },
  day3: {
    label: "Day 3 당기기",
    sub: "등 · 이두 · 사선 사슬 (마지막 60초)",
    exercises: [
      { id: "d3_1", name: "랫풀다운", goal: "4 x 8~10", sets: 4, rest: 90, rir: "2" },
      { id: "d3_2", name: "시티드 로우", goal: "3 x 8~10", sets: 3, rest: 90, rir: "2" },
      { id: "d3_3", name: "페이스 풀", goal: "3 x 12~15", sets: 3, rest: 90, rir: "1" },
      { id: "d3_4", name: "케이블 컬", goal: "3 x 10~12", sets: 3, rest: 90, rir: "1" },
      { id: "d3_5", name: "원암 케이블 로우 (한쪽)", goal: "3 x 10", sets: 3, rest: 60, rir: "2" }
    ]
  },
  day4: {
    label: "Day 4 하체·코어",
    sub: "둔근 · 햄스트링 집중 (마지막 60초)",
    exercises: [
      { id: "d4_1", name: "루마니안 데드리프트", goal: "4 x 8~10", sets: 4, rest: 90, rir: "2" },
      { id: "d4_2", name: "힙 쓰러스트", goal: "4 x 8~10", sets: 4, rest: 90, rir: "2" },
      { id: "d4_3", name: "레그 컬", goal: "3 x 10~12", sets: 3, rest: 90, rir: "1" },
      { id: "d4_4", name: "원암 런지 (보폭 넓게, 한쪽)", goal: "3 x 10", sets: 3, rest: 90, rir: "2" },
      { id: "d4_5", name: "케이블 우드찹 (한쪽)", goal: "3 x 10", sets: 3, rest: 60, rir: "2" }
    ]
  }
};

// program.json 을 못 불러왔을 때 쓰는 내장 기본 루틴
let PROGRAM = DEFAULT_PROGRAM;
let FEEDBACK = null;
let PROGRAM_UPDATED = "";
let ONLINE = true;

const STORE_KEY = "sangwoon_workout_v1";
let state = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
if (!state.history) state.history = {};
if (!state.draft) state.draft = {};
let currentDay = state.lastDay || "day2";
let viewMode = "record"; // "record" | "history"
let histFilter = "all";

function todayStr() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const wk = ["일","월","화","수","목","금","토"][d.getDay()];
  return `${mm}/${dd} (${wk})`;
}

function saveState() {
  state.lastDay = currentDay;
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => { el.style.display = "none"; }, 2200);
}

function toggleView() {
  viewMode = viewMode === "record" ? "history" : "record";
  render();
}

function getDraft(day, exId, setCount, defaultRir) {
  if (!state.draft[day]) state.draft[day] = {};
  let d = state.draft[day][exId];
  if (!d) {
    d = state.draft[day][exId] = { sets: Array(setCount).fill(""), done: Array(setCount).fill(false), rir: defaultRir, memo: "" };
  }
  if (!Array.isArray(d.sets)) d.sets = [];
  if (!Array.isArray(d.done)) d.done = [];
  while (d.sets.length < setCount) d.sets.push("");
  while (d.done.length < setCount) d.done.push(false);
  if (d.rir === undefined || d.rir === null) d.rir = defaultRir;
  return d;
}

function getLastRecord(day, exId) {
  const list = state.history[day] || [];
  if (!list.length) return null;
  const last = list[list.length - 1];
  const item = last.items && last.items[exId];
  if (!item) return null;
  return { date: last.date, ...item };
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.style.display = viewMode === "record" ? "grid" : "none";
  tabs.innerHTML = "";
  Object.keys(PROGRAM).forEach(k => {
    const b = document.createElement("button");
    b.className = "tab" + (k === currentDay ? " active" : "");
    b.textContent = PROGRAM[k].label.replace(" 하체·코어", " 코어");
    b.onclick = () => { currentDay = k; saveState(); render(); };
    tabs.appendChild(b);
  });
}

function renderHistory() {
  const fRow = document.getElementById("histFilters");
  fRow.innerHTML = "";
  const opts = [["all","전체"]].concat(Object.keys(PROGRAM).map(k => [k, PROGRAM[k].label.replace(" 하체·코어", " 코어")]));
  opts.forEach(([k, lbl]) => {
    const b = document.createElement("button");
    b.className = "f-chip" + (histFilter === k ? " active" : "");
    b.textContent = lbl;
    b.onclick = () => { histFilter = k; renderHistory(); };
    fRow.appendChild(b);
  });

  const hList = document.getElementById("histList");
  hList.innerHTML = "";
  const entries = [];
  Object.keys(PROGRAM).forEach(dk => {
    if (histFilter !== "all" && histFilter !== dk) return;
    (state.history[dk] || []).forEach((sess, idx) => {
      entries.push({ dayKey: dk, idx, ts: sess.ts || 0, sess });
    });
  });
  entries.sort((a, b) => (b.ts - a.ts) || (b.idx - a.idx));

  if (!entries.length) {
    hList.innerHTML = `<div class="ex-card" style="text-align:center;color:var(--muted);padding:28px 12px;">아직 저장된 기록이 없어요.<br>운동 후 <b>'오늘 기록 저장'</b>을 누르면 여기에 차곡차곡 쌓입니다.</div>`;
    return;
  }

  entries.forEach(({ dayKey, idx, sess }) => {
    const dayObj = PROGRAM[dayKey];
    const card = document.createElement("div");
    card.className = "hist-card";
    let linesHtml = "";
    dayObj.exercises.forEach(ex => {
      const it = sess.items && sess.items[ex.id];
      if (!it) return;
      const sTxt = (it.sets || []).filter(Boolean).join(" / ");
      if (!sTxt) return;
      linesHtml += `<div class="hist-line"><b>${ex.name}</b>: ${sTxt} <span style="color:var(--muted);font-size:12px;">(RIR ${it.rir || "-"}${it.memo ? " · " + it.memo : ""})</span></div>`;
    });
    card.innerHTML = `
      <div class="hist-head">
        <div class="hist-title">${sess.date} · ${dayObj.label}</div>
        <div style="display:flex;gap:6px;">
          <button class="del-btn" style="color:var(--accent);border-color:var(--accent);" onclick="copyHistory('${dayKey}', ${idx})">복사</button>
          <button class="del-btn" onclick="deleteHistory('${dayKey}', ${idx})">삭제</button>
        </div>
      </div>
      ${linesHtml || '<div class="hist-line" style="color:var(--muted);">기록 없음</div>'}`;
    hList.appendChild(card);
  });
}

function deleteHistory(dayKey, idx) {
  if (!confirm("이 날짜 기록을 삭제할까요?")) return;
  state.history[dayKey].splice(idx, 1);
  saveState();
  renderHistory();
  showToast("기록이 삭제됐어요");
}

function renderFeedback() {
  const box = document.getElementById("fbBanner");
  const lbl = document.getElementById("fbLabel");
  const txt = document.getElementById("fbText");
  if (FEEDBACK && FEEDBACK.text) {
    lbl.textContent = (FEEDBACK.title || "코치 메모") + (FEEDBACK.date ? " · " + FEEDBACK.date : "");
    txt.textContent = FEEDBACK.text;
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
  const note = document.getElementById("syncNote");
  if (ONLINE) {
    note.className = "sync-note";
    note.textContent = PROGRAM_UPDATED ? "루틴 " + PROGRAM_UPDATED + " 기준" : "";
  } else {
    note.className = "sync-note off";
    note.textContent = "오프라인 · 내장 루틴으로 동작 중";
  }
}

async function loadProgram() {
  try {
    const res = await fetch("./program.json?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data && data.program && typeof data.program === "object") {
      const next = {};
      Object.keys(data.program).forEach(k => {
        const d = data.program[k];
        if (!d || !Array.isArray(d.exercises) || !d.exercises.length) return;
        d.exercises.forEach((ex, i) => {
          if (!ex.id) ex.id = k + "_" + (i + 1);
          const n = Number(ex.sets);
          ex.sets = (isFinite(n) && n > 0) ? Math.min(Math.round(n), 10) : 3;
          ex.name = ex.name || "운동 " + (i + 1);
          ex.goal = ex.goal || "";
        });
        next[k] = d;
      });
      if (Object.keys(next).length) PROGRAM = next;
    }
    FEEDBACK = (data && data.feedback) || null;
    PROGRAM_UPDATED = (data && (data.updated || data.version)) || "";
    ONLINE = true;
  } catch (err) {
    PROGRAM = DEFAULT_PROGRAM;
    ONLINE = false;
  }
  if (!PROGRAM[currentDay]) currentDay = Object.keys(PROGRAM)[0];
  renderFeedback();
  render();
}

function render() {
  document.getElementById("todayLabel").textContent = todayStr();
  const mBtn = document.getElementById("modeBtn");
  mBtn.textContent = viewMode === "record" ? "히스토리" : "기록하기";
  mBtn.classList.toggle("active", viewMode === "history");

  renderTabs();
  document.getElementById("recordView").style.display = viewMode === "record" ? "block" : "none";
  document.getElementById("historyView").style.display = viewMode === "history" ? "block" : "none";

  if (viewMode === "history") {
    renderHistory();
    return;
  }

  const dayObj = PROGRAM[currentDay];
  document.getElementById("dayTitle").textContent = dayObj.label;
  document.getElementById("daySub").textContent = dayObj.sub;

  const list = document.getElementById("exList");
  list.innerHTML = "";
  let totalSets = 0, doneSets = 0;

  dayObj.exercises.forEach((ex, idx) => {
    const d = getDraft(currentDay, ex.id, ex.sets, ex.rir);
    const prev = getLastRecord(currentDay, ex.id);
    totalSets += ex.sets;
    doneSets += d.done.slice(0, ex.sets).filter(Boolean).length;

    const card = document.createElement("div");
    card.className = "ex-card";

    let prevHtml = `<div class="prev-box empty">직전 기록 없음 (첫 세션)</div>`;
    if (prev && (prev.sets || []).some(s => (s || "").trim() !== "")) {
      const sTxt = prev.sets.filter(Boolean).join(" / ");
      prevHtml = `<div class="prev-box">직전 (${prev.date}): <b>${sTxt}</b> · RIR ${prev.rir || "-"}${prev.memo ? " · " + prev.memo : ""}</div>`;
    }

    let setsHtml = `<div class="sets-grid">`;
    for (let i = 0; i < ex.sets; i++) {
      const isDone = d.done[i];
      setsHtml += `
        <div class="set-row ${isDone ? "done" : ""}" id="row_${ex.id}_${i}">
          <span class="set-lbl">${i + 1}</span>
          <input class="set-inp" type="text" placeholder="예: 8핀x10" value="${(d.sets[i] || "").replace(/"/g, "&quot;")}"
            oninput="updateSet('${ex.id}', ${i}, this.value)">
          <button class="check-btn" onclick="toggleDone('${ex.id}', ${i}, ${ex.rest})">${isDone ? "✓" : ""}</button>
        </div>`;
    }
    setsHtml += `</div>`;

    const rirOpts = ["0","1","2","3","4"].map(v => `<option value="${v}" ${d.rir === v ? "selected" : ""}>RIR ${v}</option>`).join("");

    card.innerHTML = `
      <div class="ex-head">
        <div class="ex-name">${idx + 1}. ${ex.name}</div>
        <div class="ex-goal">${ex.goal}</div>
      </div>
      ${prevHtml}
      ${setsHtml}
      <div class="meta-row">
        <select class="rir-select" onchange="updateRir('${ex.id}', this.value)">${rirOpts}</select>
        <input class="memo-inp" type="text" placeholder="메모 (핀 위치, 느낌 등)" value="${(d.memo || "").replace(/"/g, "&quot;")}"
          oninput="updateMemo('${ex.id}', this.value)">
      </div>`;
    list.appendChild(card);
  });

  document.getElementById("doneCount").textContent = `${doneSets} / ${totalSets} 세트`;
}

function updateSet(exId, idx, val) {
  state.draft[currentDay][exId].sets[idx] = val;
  saveState();
}
function toggleDone(exId, idx, restSec) {
  const d = state.draft[currentDay][exId];
  d.done[idx] = !d.done[idx];
  saveState();
  render();
  if (d.done[idx]) startTimer(restSec || 90);
}
function updateRir(exId, val) {
  state.draft[currentDay][exId].rir = val;
  saveState();
}
function updateMemo(exId, val) {
  state.draft[currentDay][exId].memo = val;
  saveState();
}

function finishSession() {
  const dayObj = PROGRAM[currentDay];
  const items = {};
  let hasAny = false;
  dayObj.exercises.forEach(ex => {
    const d = getDraft(currentDay, ex.id, ex.sets, ex.rir);
    if (d.sets.some(s => (s || "").trim() !== "")) hasAny = true;
    items[ex.id] = { sets: [...d.sets], rir: d.rir, memo: d.memo };
  });
  if (!hasAny) { showToast("최소 한 세트 이상 적어 주세요"); return; }
  if (!state.history[currentDay]) state.history[currentDay] = [];
  state.history[currentDay].push({ date: todayStr(), ts: Date.now(), items });
  dayObj.exercises.forEach(ex => {
    state.draft[currentDay][ex.id] = { sets: Array(ex.sets).fill(""), done: Array(ex.sets).fill(false), rir: ex.rir, memo: "" };
  });
  saveState();
  render();
  showToast("저장 완료! 히스토리에도 쌓였어요");
}

function formatSessionText(dayKey, dateLabel, items) {
  const dayObj = PROGRAM[dayKey];
  const lines = [`[${dateLabel} ${dayObj.label}]`];
  dayObj.exercises.forEach(ex => {
    const it = items && items[ex.id];
    if (!it) return;
    const sTxt = (it.sets || []).filter(Boolean).join(", ");
    if (sTxt) lines.push(`- ${ex.name}: ${sTxt} (RIR ${it.rir || "-"}${it.memo ? ", " + it.memo : ""})`);
  });
  return lines;
}

function copyHistory(dayKey, idx) {
  const sess = (state.history[dayKey] || [])[idx];
  if (!sess) return;
  const lines = formatSessionText(dayKey, sess.date, sess.items);
  if (lines.length === 1) { showToast("복사할 기록이 없어요"); return; }
  navigator.clipboard.writeText(lines.join("\n")).then(() => showToast("복사됐어요! 요니에게 붙여넣기 하세요"));
}

function copyReport() {
  let lines = formatSessionText(currentDay, todayStr(), state.draft[currentDay]);
  if (lines.length === 1) {
    const list = state.history[currentDay] || [];
    if (list.length) {
      const last = list[list.length - 1];
      lines = formatSessionText(currentDay, last.date, last.items);
    }
  }
  if (lines.length === 1) { showToast("복사할 기록이 아직 없어요"); return; }
  navigator.clipboard.writeText(lines.join("\n")).then(() => showToast("복사됐어요! 요니에게 붙여넣기 하세요"));
}

let timerInt = null, remSec = 90;
function fmt(s) { return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }
function startTimer(sec) {
  clearInterval(timerInt);
  remSec = sec;
  const disp = document.getElementById("timerDisplay");
  disp.classList.remove("done");
  disp.textContent = fmt(remSec);
  timerInt = setInterval(() => {
    remSec--;
    if (remSec <= 0) {
      clearInterval(timerInt);
      disp.textContent = "끝!";
      disp.classList.add("done");
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      return;
    }
    disp.textContent = fmt(remSec);
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInt);
  document.getElementById("timerDisplay").textContent = "01:30";
  document.getElementById("timerDisplay").classList.remove("done");
}

render();
renderFeedback();
loadProgram();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
